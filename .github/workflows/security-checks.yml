name: Recorder security and runtime checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run verify
      - run: npm test
      - run: npm run test:media-runtime
