name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Keep release out of automatic updates pending physical capture QA
        type: boolean
        default: true
      bridge_source_repo:
        description: Also attach this release to the source repository, for installed copies that still check it (keep on until the source repository goes private)
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing a draft made by a manual run creates its tag, and a pushed tag also starts this
  # workflow. That second run rebuilt, signed and notarized the same commit only to fail at
  # "a release with the same tag name already exists" (v0.13.0, run 41935240433). A pushed
  # tag whose release already exists is skipped; a tag pushed to publish at once still builds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          RELEASES_REPO="$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && { gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || GH_TOKEN="$RELEASES_TOKEN" gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" >/dev/null 2>&1; }; then
            echo "Release $GITHUB_REF_NAME already exists (a published draft): nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-14
    # Notarization is a round trip to Apple and is usually minutes, but the queue can be
    # slow enough to matter; the build itself is a few minutes of that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci

      - name: Verify capture and local recording storage
        run: |
          npm run verify
          npm test

      # Newer npm blocks package install scripts by default, so Electron's postinstall — the
      # step that downloads the actual binary — can be skipped silently. The failure then
      # surfaces much later as an unrelated-looking packaging error, so check for the binary
      # and run the installer directly if it is missing.
      - name: Ensure the Electron binary is installed
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            echo "electron/dist missing — running its install script directly"
            node node_modules/electron/install.js
          fi
          test -d node_modules/electron/dist

      - name: Audit dependencies and verify Electron media runtime and capture timing
        run: |
          npm audit --audit-level=low
          npm run test:media-runtime
          npm run test:capture-runtime
          npm run test:recorder-ui

      # Both signing secrets are decoded to files rather than passed as base64 strings.
      # CSC_LINK does accept inline base64, but macOS `base64` wraps its output at 76
      # columns, and a wrapped value stops looking like base64 to electron-builder — which
      # then treats it as a FILE PATH and fails with "<secret> doesn't exist", masked in the
      # log so the real cause is invisible. Decoding here tolerates wrapped or unwrapped
      # input. runner.temp is wiped when the job ends.
      - name: Stage signing secrets
        run: |
          echo "${{ secrets.MAC_CERT_P12_BASE64 }}" | base64 --decode > "${{ runner.temp }}/cert.p12"
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "${{ runner.temp }}/AuthKey.p8"
          # Fail here, with a clear message, rather than deep inside electron-builder.
          test -s "${{ runner.temp }}/cert.p12" || { echo "MAC_CERT_P12_BASE64 decoded to nothing" >&2; exit 1; }
          test -s "${{ runner.temp }}/AuthKey.p8" || { echo "APPLE_API_KEY_BASE64 decoded to nothing" >&2; exit 1; }
          head -c 4 "${{ runner.temp }}/AuthKey.p8" | grep -q -- "----" || { echo "APPLE_API_KEY_BASE64 is not a PEM key" >&2; exit 1; }

      - name: Build, sign, notarize and verify universal DMG
        run: npm run dist:mac
        env:
          FORGENOTES_SUPABASE_ANON_KEY: ${{ secrets.FORGENOTES_SUPABASE_ANON_KEY }}
          # Developer ID certificate. electron-builder imports this into a throwaway
          # keychain for the job, from the file staged above.
          CSC_LINK: ${{ runner.temp }}/cert.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          # Notarization credentials.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove signing secrets
        if: always()
        run: rm -f "${{ runner.temp }}/AuthKey.p8" "${{ runner.temp }}/cert.p12"

      # Without latest-mac.yml every installed copy silently stops updating, and nothing
      # else in the job would fail. Check for it explicitly.
      - name: Confirm auto-update metadata was produced
        run: |
          test -f release/latest-mac.yml || { echo "latest-mac.yml missing — auto-update would break" >&2; exit 1; }
          test -f release/ForgeNotes-Recorder.zip || { echo "zip missing — Squirrel.Mac cannot update from a DMG" >&2; exit 1; }
          cat release/latest-mac.yml
          # The installed app checks the repository named in app-update.yml for updates.
          RELEASES_REPO="$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")"
          feed="$(find release -path '*.app/Contents/Resources/app-update.yml' | head -1)"
          test -n "$feed" || { echo "app-update.yml missing from the app bundle" >&2; exit 1; }
          grep -qx "repo: ${RELEASES_REPO#*/}" "$feed" || { echo "app-update.yml does not point at $RELEASES_REPO" >&2; cat "$feed" >&2; exit 1; }
          echo "Update feed: $RELEASES_REPO"

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 ForgeNotes-Recorder.dmg > ForgeNotes-Recorder.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeNotes-Recorder-macOS-${{ github.sha }}
          path: |
            release/ForgeNotes-Recorder.dmg
            release/ForgeNotes-Recorder.dmg.sha256
            release/ForgeNotes-Recorder.zip
            release/latest-mac.yml
          if-no-files-found: error

      # Releases live in a public releases-only repository (package.json build.publish, which
      # electron-builder also writes into the installed app's app-update.yml, so installed
      # copies check that repository for updates). The source repository can then be private.
      # Copies installed before the move still check THIS repository, so until it goes
      # private each release is also attached here (bridge_source_repo; always on for a
      # pushed tag). github.token cannot write to another repository: RELEASES_REPO_TOKEN is a
      # fine-grained token with Contents read/write on the releases repository only.
      # The zip and latest-mac.yml are what electron-updater reads; the DMG is only for
      # humans doing a first install. Blockmaps make updates differential when present.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          shopt -s nullglob
          RELEASES_REPO="$(node -p "require('./package.json').build.publish[0].owner + '/' + require('./package.json').build.publish[0].repo")"
          if [[ -z "$RELEASES_TOKEN" ]]; then
            echo "::error::RELEASES_REPO_TOKEN is not set: it needs Contents read/write on $RELEASES_REPO"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            SOURCE_EXTRA=(--verify-tag)
          else
            TAG="v$(node -p "require('./package.json').version")"
            SOURCE_EXTRA=(--target "$GITHUB_SHA")
          fi
          DRAFT=()
          if [[ "$RELEASE_DRAFT" == "true" ]]; then DRAFT=(--draft); fi
          files=(
            release/ForgeNotes-Recorder.dmg
            release/ForgeNotes-Recorder.dmg.sha256
            release/ForgeNotes-Recorder.zip
            release/latest-mac.yml
          )
          files+=(release/*.blockmap)
          if GH_TOKEN="$RELEASES_TOKEN" gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "$RELEASES_REPO already has $TAG: not replaced."
          else
            # The tag is made on the releases repository's default branch; the source commit
            # is named in the notes, since it does not exist there.
            cp INTERNAL_INSTALL.md "$RUNNER_TEMP/notes.md"
            printf '\nBuilt from %s@%s.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$RUNNER_TEMP/notes.md"
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" "${files[@]}" \
              --repo "$RELEASES_REPO" "${DRAFT[@]}" \
              --title "$TAG — macOS" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if [[ "$BRIDGE_SOURCE" == "true" ]]; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$GITHUB_REPOSITORY already has $TAG: not replaced."
            else
              gh release create "$TAG" "${files[@]}" \
                --repo "$GITHUB_REPOSITORY" "${SOURCE_EXTRA[@]}" "${DRAFT[@]}" \
                --title "$TAG — macOS" \
                --notes-file INTERNAL_INSTALL.md
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          BRIDGE_SOURCE: ${{ github.event_name != 'workflow_dispatch' || inputs.bridge_source_repo }}
